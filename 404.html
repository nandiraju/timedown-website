<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | CounttMinus</title>
    <meta name="description" content="This page doesn't exist. Head back to CounttMinus, the clean, simple countdown app for iOS.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0b0f19">

    <link rel="icon" type="image/webp" href="/assets/images/app-icon.webp?v=2">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/images/favicon-48x48.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icon-192x192.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png?v=2">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Precompiled Tailwind CSS -->
    <link rel="stylesheet" href="/assets/css/404.css?v=be0ae1a7c7">
    <script src="/assets/js/analytics.js"></script>

    <!-- Dark theme by default -->
    <script>
        (function () {
            let light = false;
            try { light = localStorage.getItem('mm-theme') === 'light'; } catch (_) {}
            document.documentElement.classList.toggle('dark', !light);
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', light ? '#f8fbff' : '#0b0f19');
        })();
    </script>
</head>
<body class="bg-[var(--bg-color)] text-[var(--text-main)] font-[family-name:var(--font-inter)] antialiased min-h-screen flex flex-col justify-between transition-colors duration-300">
    <div class="ambient" aria-hidden="true"></div>

    <header class="sticky top-0 z-50 backdrop-blur-xl bg-[rgba(255,255,255,0.7)] dark:bg-[rgba(11,15,25,0.75)] border-b border-[var(--surface-border)]">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 group">
                <img src="/assets/images/app-icon.webp" alt="CounttMinus App Icon" width="40" height="40" class="w-10 h-10 rounded-xl shadow-md group-hover:scale-105 transition-transform">
                <span class="font-[family-name:var(--font-outfit)] text-xl font-bold tracking-tight text-[var(--text-heading)]">CounttMinus</span>
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center py-20">
        <section class="max-w-xl mx-auto px-6 text-center">
            <p class="font-[family-name:var(--font-outfit)] text-7xl sm:text-9xl font-black text-indigo-500 mb-4">404</p>
            <h1 class="font-[family-name:var(--font-outfit)] text-3xl sm:text-4xl font-extrabold text-[var(--text-heading)] mb-4">
                Page Not Found
            </h1>
            <p class="text-base text-[var(--text-main)] mb-8 leading-relaxed">
                The page you're looking for doesn't exist or has moved. Head back home to start counting down to your next big day.
            </p>
            <div class="flex flex-wrap justify-center gap-4">
                <a href="/" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-full shadow-lg shadow-indigo-600/25 transition-all">
                    Back to Home
                </a>
                <a href="/contact.html" class="px-6 py-3 rounded-full text-sm font-semibold text-[var(--text-heading)] bg-[var(--surface-card)] border border-[var(--surface-border)] hover:bg-slate-800 transition-all">
                    Contact Developer
                </a>
            </div>
        </section>
    </main>

    <footer class="border-t border-[var(--surface-border)] py-8 text-center text-xs text-slate-500">
        <p>&copy; 2026 Srikanth Nandiraju. CounttMinus.</p>
    </footer>
</body>
</html>
